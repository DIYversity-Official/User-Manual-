name: 매뉴얼 검색 페이지 게시

# 위키를 고치면(gollum) 검색 목록을 다시 만들어 GitHub Pages 에 올린다.
# 위키 git push 가 gollum 이벤트를 안 낼 때를 대비해 하루 한 번도 다시 만든다.
on:
  gollum:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"   # 매일 03:17 (KST)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 위키 가져오기
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" wiki

      - name: 검색 목록 만들기
        run: |
          mkdir -p _site
          cp index.html _site/
          python3 build_index.py wiki _site/search-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
