<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect x="0" y="0" width="900" height="430" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2328">다운라이트 설치 구성</text>

  <!-- 천장 -->
  <rect x="300" y="70" width="570" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="585" y="98" font-size="15" font-weight="700" text-anchor="middle" fill="#57606a">천장 — 다운라이트 전구 최대 6개</text>
  <g>
    <circle cx="380" cy="150" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="380" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH1</text>
    <circle cx="480" cy="150" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="480" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH2</text>
    <circle cx="580" cy="150" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="580" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH3</text>
    <circle cx="680" cy="150" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="680" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH4</text>
    <circle cx="780" cy="150" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="780" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH5</text>
    <circle cx="830" cy="225" r="26" fill="#fff3bf" stroke="#e0a800" stroke-width="2"/><text x="830" y="230" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">CH6</text>
  </g>
  <text x="585" y="358" font-size="12" text-anchor="middle" fill="#57606a">전구마다 따뜻한 빛(WW)·차가운 빛(CW) 두 줄 → 2700K ~ 6500K</text>

  <!-- 제어기 -->
  <rect x="470" y="270" width="150" height="60" rx="10" fill="#fcc419" stroke="#e0a800"/>
  <text x="545" y="297" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">다운라이트</text>
  <text x="545" y="317" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">제어기</text>
  <g stroke="#8c959f" stroke-width="2" fill="none">
    <path d="M500 270 L380 176"/><path d="M520 270 L480 176"/><path d="M545 270 L580 176"/>
    <path d="M570 270 L680 176"/><path d="M590 270 L780 176"/><path d="M620 290 L804 230"/>
  </g>

  <!-- 어댑터 -->
  <rect x="330" y="285" width="90" height="34" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="375" y="307" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">24V 어댑터</text>
  <line x1="420" y1="302" x2="470" y2="302" stroke="#57606a" stroke-width="3"/>

  <!-- 공유기와 폰 -->
  <rect x="40" y="130" width="110" height="40" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="95" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">공유기</text>
  <text x="95" y="188" font-size="12" text-anchor="middle" fill="#57606a">2.4GHz WiFi</text>
  <rect x="60" y="235" width="70" height="110" rx="12" fill="#ffffff" stroke="#57606a"/>
  <rect x="68" y="248" width="54" height="80" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="95" y="292" font-size="11" text-anchor="middle" fill="#1f2328">DIYversity</text>
  <text x="95" y="365" font-size="12" text-anchor="middle" fill="#57606a">앱 (Android · iOS)</text>
  <line x1="95" y1="170" x2="95" y2="235" stroke="#8c959f" stroke-dasharray="5 4" stroke-width="2"/>
  <path d="M150 150 C 300 150, 400 250, 470 290" stroke="#8c959f" stroke-dasharray="5 4" stroke-width="2" fill="none"/>
  <text x="255" y="185" font-size="12" text-anchor="middle" fill="#8c959f">무선 연결</text>

  <text x="450" y="405" font-size="12" text-anchor="middle" fill="#8c959f">공유기 없이 제어기 자체 WiFi(AP 모드)로도 쓸 수 있습니다 · 여러 대는 그룹으로 묶습니다</text>
</svg>
